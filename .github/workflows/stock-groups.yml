name: Refresh stock groups

# The built-in stock groups' member lists ship with the app (ADR 0030, ADR 0079).
# Once a month this refreshes them from their public sources and opens a pull
# request with the changes; it can also be run by hand from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 2 * *'
  push:
    branches: [claude/project-thread-ouoquv]
    paths: [packages/domain/scripts/update-stock-groups.mjs, .github/workflows/stock-groups.yml]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: stock-groups-${{ github.ref }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe Russell sources (temporary)
        continue-on-error: true
        run: |
          exec > >(tee -a "$RUNNER_TEMP/diag.txt") 2>&1
          UA="trading-magician-stock-groups/1.0 (member list refresh)"
          for u in \
            "https://investor.vanguard.com/investment-products/etfs/profile/api/VTWO/portfolio-holding/stock?start=1&count=5" \
            "https://investor.vanguard.com/investment-products/etfs/profile/api/VONE/portfolio-holding/stock?start=1&count=5" \
            "https://www.ishares.com/us/products/239710/ishares-russell-2000-etf/1467271812596.ajax?fileType=csv&fileName=IWM_holdings&dataType=fund" \
            "https://www.lseg.com/content/dam/ftse-russell/en_us/documents/membership/russell-2000-membership-list.pdf" \
            "https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/holdings-daily-us-en-twok.xlsx" \
            "https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/holdings-daily-us-en-dia.xlsx" \
            "https://www.invesco.com/us/financial-products/etfs/holdings/main/holdings/0?audienceType=Investor&action=download&ticker=QQQ" \
            ; do
            echo "=== $u"
            curl -sS -L -A "$UA" -m 30 -o /tmp/probe -w "status %{http_code} type %{content_type} bytes %{size_download} final %{url_effective}\n" "$u" || true
            head -c 400 /tmp/probe | tr -c '[:print:]\n' '?' ; echo
          done
      - name: Refresh the S&P 500
        run: pnpm --filter @tm/domain sp500:update
      - name: Refresh the other groups
        continue-on-error: true
        run: pnpm --filter @tm/domain groups:update 2>&1 | tee -a "$RUNNER_TEMP/diag.txt"; exit ${PIPESTATUS[0]}
      - name: Propose the changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_name }}" != "main" ] && [ -f "$RUNNER_TEMP/diag.txt" ]; then
            cp "$RUNNER_TEMP/diag.txt" stock-groups-diagnostics.txt && git add stock-groups-diagnostics.txt
          fi
          if git diff --quiet HEAD; then echo "No member changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.ref_name }}" != "main" ]; then
            git commit -am "Refresh stock group member lists"
            git push
            exit 0
          fi
          branch="stock-groups/refresh-$(date -u +%Y-%m-%d)"
          git checkout -b "$branch"
          git commit -am "Refresh stock group member lists ($(date -u +%Y-%m-%d))"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Refresh stock group member lists ($(date -u +%Y-%m-%d))" \
            --body "Monthly refresh of the built-in stock groups' members (S&P 500, Nasdaq 100, Dow 30, S&P 400/600, Russell 1000/2000). Review the diff for index changes."
